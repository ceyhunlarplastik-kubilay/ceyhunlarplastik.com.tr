# CI kalite kapısı (tarihçe: IMPROVEMENT_LOG.md § P0.1 + P1.7)
# Yalnızca kalite kontrolü yapar; hiçbir stage'e deploy ETMEZ ve AWS erişimi gerektirmez.
# Node sürümü .nvmrc'den gelir (şu an 24.19.0).
#
# Bloklayıcı adımlar:
# - Backend typecheck: tsconfig.backend.json core+functions'ı .sst'siz denetler
#   (root tsconfig CI'da kullanılamaz: infra/** global sst.* tiplerini .sst/platform'dan
#   alır, .sst gitignored; frontend'i jsx flag'siz kapsayıp sahte hata üretir).
# - Frontend typecheck + üç test paketi (core / functions / frontend).
# - Lint: 0 error şart. .open-next/** ignore'lu; hook kuralları (set-state-in-effect,
#   refs) bloklayıcı; yalnız @typescript-eslint/no-explicit-any warn olarak tolere
#   edilir (~157 mevcut kullanım — bkz. packages/frontend/eslint.config.mjs).
# - Audit: yalnız `critical` seviyesi bloklayıcı.
#
# Advisory (job'u kırmaz): `npm audit --audit-level=high`. Kalan high'lar ya dev-only
# tooling'de (prisma CLI + @prisma/dev dev-server; deepl-node -> adm-zip translate CLI)
# ya da major bump'sız düzeltilemeyen düşük-pratik-riskli transitive'lerde
# (fast-uri <- @middy/validator; ip-address <- mqtt lazy chunk; nanoid <- next).
# Deploy edilen Lambda'ya yalnız fast-uri giriyor; host-confusion pratik riski düşük
# (bkz. IMPROVEMENT_LOG.md P0.3).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: "Typecheck (backend: core + functions)"
        run: npm run typecheck:backend
      - name: Typecheck (frontend)
        run: npm run typecheck -w frontend
      - name: Unit tests (core)
        # vitest core'un devDependency'si; sst shell GEREKMEZ (prisma testlerde mock'lanır)
        run: npm run test:ci -w @ceyhunlarweb/core
      - name: Unit tests (functions)
        # Response validator kontratlarını gerçek functions workspace sınırında doğrular.
        run: npm run test -w @ceyhunlarweb/functions
      - name: Unit tests (frontend)
        # vitest root node_modules'a hoist edilir (core devDep); lockfile bunu deterministik kılar
        run: npm run test -w frontend

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w frontend

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Audit (critical — bloklayıcı)
        run: npm audit --omit=dev --audit-level=critical
      - name: "Audit (high — advisory; kalan high'lar dev-only tooling + düşük-riskli transitive)"
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
